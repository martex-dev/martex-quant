# The remainder the committed documents do not allocate. Carried explicitly
# rather than distributed by guess: assigning it would be fabrication, and
# adjusting a documented delta to close it would alter the research record.
[unallocated]
reason = "Documented per-hypothesis deltas do not sum to the ledger's stated total (120 before H58, 125 after). The gap is reported, not absorbed."
