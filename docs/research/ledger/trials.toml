evidence = "Ledger: +1 -> 126. ALL FIVE BARS PASS on 2,124 common days (2020-09-15..2026-07-09), 8 symbols, 1x collateralized: mean +0.868bp/day CI [+0.245,+1.611]; CAGR +3.24%; Sharpe 2.29; corr with rotation-stop +0.0041 (n=2,120); DSR 0.9754 @126. MDD -5.09%."
notes = "First validated edge outside the long-crypto momentum family and the first with near-zero correlation to the deployed spec (everything else measured correlates 0.52-0.82; meta-finding 5). Decomposition: funding +4.717%/yr, basis drift -0.255%/yr, costs -1.291%/yr. REGIME CAVEAT, load-bearing: the edge is concentrated in 2021 (+15.68%/yr), inverted in 2022 (-4.83%/yr), and earns +0.08%/yr at Sharpe 0.34 over the last 365 days. H05 pre-flagged this and was right. Bars were fixed in advance and are not revised, but no forward expectation may be built on the full-sample +3.24%. Pre-registered and committed (4b8d855) before the engine was written."

[[entries]]
hypothesis = "H63"
family = "strategy.carry.funding_conditional"
trial_count = 3
grade = "strategy"
protocol = "confirmatory"
verdict = "eligible"
maturity = "L4"
dsr = 1.0
dsr_n_trials = 129
source = "docs/hypotheses/63-funding-conditional-carry.md"
evidence = "Ledger: +3 -> 129 (declared 3-cell grid L in {7,30,90}, ALL cells reported). Primary L=30 on H62's identical 2,124-day window: Sharpe 6.00 vs incumbent 2.29, CAGR +4.51% vs +3.24%, MDD -0.51% vs -5.09%, 2022 net -0.01%/yr vs -4.83%/yr, mean +1.205bp/day CI [+0.697,+1.867], DSR 1.0000 @129. Gate A and Gate B both pass. Grid cells: L=7 Sharpe 5.00, L=30 Sharpe 6.00, L=90 Sharpe 5.89."
notes = "Replaces H62 as the carry spec. Believed rather than merely passed because all three cells agree across a 13x lookback range (a plateau, not a spike) and the filter improves all 7 years monotonically, with deployment at 79.2% of symbol-days so the Sharpe is not an idle-capital artifact. LOAD-BEARING CAVEAT: it does NOT fix the dead recent regime -- last 365 days move only +0.08%/yr to +0.15%/yr. A filter cannot create a premium nobody is paying; forward expectation at current funding is ~0%/yr. FIRST DOCUMENTED EXCEPTION TO META-FINDING 2 (sizing beats switching), with the mechanism stated in the pre-registration BEFORE the run: this switch conditions on the revenue itself, not on a proxy for it. Proposed refinement: switches fail when they condition on a predictor of the payoff, and can succeed when they condition on the payoff itself. Pre-registered and committed (0e87191) before the engine filter existed."

[[entries]]
hypothesis = "H64"
family = "strategy.statarb.cointegration"
trial_count = 12
grade = "strategy"
protocol = "confirmatory"
verdict = "killed"
maturity = "L3"
source = "docs/hypotheses/64-cointegration-pairs.md"
evidence = "Ledger: +12 -> 141 (declared 12-cell grid, ALL cells reported). Gate A failed on all four bars at the primary cell (z_in 2.0, z_out 0.5, hold 30): mean -0.509bp/day CI low -3.429bp, CAGR -2.82%, Sharpe -0.15, DSR 0.0783 @141. No cell in the grid exceeds Sharpe 0.21; nine of twelve are negative; every cell carries a -29% to -38% MDD on a book with no net directional exposure."
notes = "First hypothesis of family F4 (stat-arb). Gate B PASSED -- corr -0.0674 with rotation-stop and -0.0627 with H63 carry -- so the book was genuinely market-neutral and this is a validated machine finding no edge, not a broken one. Cointegration was found consistently (12.8 qualifying pairs on average) and the Engle-Granger implementation is calibrated (4.0% false positives on 300 simulated independent random walks vs nominal 5%). The mechanism is the link-break named in the pre-registration: cointegration measured over 365 days does not survive the next 180. SECOND INDEPENDENT CONFIRMATION that crypto does not mean-revert at retail cost, after H04 on absolute prices; with H44/H45/H53/H57 intraday (real but sub-cost) the reversion family is closed. Specification gap filled at implementation: the pre-registration caps concurrent pairs at 10 but does not say which 10, so candidates are ranked by strongest formation-window ADF statistic -- a formation-time quantity, no look-ahead, no alternative tested. All §7 limitations bias TOWARD the strategy, so the kill needs no pessimistic re-run. Pre-registered and committed (2bdf61d) before any code existed."

[[entries]]
hypothesis = "H65"
family = "strategy.carry.wide_universe"
trial_count = 3
grade = "strategy"
protocol = "confirmatory"
verdict = "candidate"
maturity = "L4"
dsr = 1.0
dsr_n_trials = 144
source = "docs/hypotheses/65-wide-universe-carry.md"
evidence = "Ledger: +3 -> 144 (declared 3-cell grid L in {7,30,90}, ALL cells reported). STANDALONE-VIABLE: Gate A and Gate C pass, Gate B fails. Wide book (34 symbols, L=30) Sharpe 5.60, CAGR +4.36%, MDD -0.76%, DSR 1.0000 @144, mean +1.170bp/day CI low +0.669bp, corr with rotation-stop -0.0040. The 8-symbol incumbent recomputed in the SAME run on the SAME window: Sharpe 5.91, CAGR +4.64%. Grid: L=7 Sharpe 4.23, L=30 5.60, L=90 5.71."
notes = "FIRST USE of docs/research/standalone-viable-amendment.md. Under the pre-2026-08-27 rule this would have been recorded KILLED alongside H04 mean-reversion, which had no edge at all; it clears every absolute bar and merely loses to the incumbent. NOT deployed, and it does NOT count toward the eight-edge target -- it is the same edge as H63 harvested more widely, not an independent one. FINDING: meta-finding 3 (breadth feeds cross-sectional edges) does NOT extend to carry. Going 8 -> 34 symbols LOWERED Sharpe. Proposed refinement, offered as a hypothesis and not an established rule: breadth feeds edges that SELECT and dilutes edges that HARVEST. CONFOUND recorded honestly -- symbol count rises monotonically (11 in 2020 to 34 in 2026) while returns fall, and the extra symbols exist mostly in the thin-funding years, so dilution cannot be fully separated from timing; a clean test needs a universe held constant through time. The 7 cost caveat did not need invoking: Gate B failed under the OPTIMISTIC cost model, so honest wider spreads on thin listings would only widen the gap. Third confirmation that carry earns ~nothing today (2025 -0.08%/yr, 2026 -0.78%/yr). Pre-registered and committed (8cb096f) before the study existed."

[[entries]]
hypothesis = "H66"
family = "strategy.carry.cross_sectional"
trial_count = 3
grade = "strategy"
protocol = "confirmatory"
verdict = "candidate"
maturity = "L4"
dsr = 1.0
dsr_n_trials = 147
source = "docs/hypotheses/66-cross-sectional-carry.md"
evidence = "Ledger: +3 -> 147 (declared K grid {3,5,10}, ALL cells reported). STANDALONE-VIABLE: Gate A passes, Gate B fails, Gate C bar 8 fails. Primary K=5: Sharpe 2.99, CAGR +3.50%, MDD -5.52%, DSR 1.0000 @147, mean +0.944bp/day CI low +0.263bp, corr rotation-stop +0.0076. Incumbents recomputed in the same run on the same window: harvest-34 Sharpe 5.60 / CAGR +4.36% / MDD -0.76%; harvest-8 Sharpe 5.91 / CAGR +4.64% / MDD -0.84%. Grid monotone: K=3 2.27, K=5 2.99, K=10 4.06."
notes = "REFUTES the select/harvest refinement proposed in H65 8.1 one hypothesis earlier. H66 was registered specifically to test it and predicted top-K would beat harvest-all; it loses monotonically -- the less you select, the better it gets. H65's verdict and figures stand; only its speculative refinement is withdrawn, and H65 is annotated in place. BETTER EXPLANATION: carry's high Sharpe is a DIVERSIFICATION property, not a premium-size one. K=10 keeps nearly the same mean (+3.93% vs +4.36%) while MDD grows fivefold (-4.17% vs -0.76%); at K=3 MDD is -7.65%, ten times the harvest book. Averaging ~20 near-independent small funding streams is what produces Sharpe 5.9, not the size of any premium. This also undercuts H65's dilution story: if the extra 26 symbols were dilution, concentrating should have helped. Section 3's squeeze prediction -- 'will show up as drawdown, not as mean' -- was written before the run and is exactly what happened; bar 8 was set at 3 points before any drawdown was seen and fails at 4.76. IMPLEMENTATION DEFECT found and corrected before recording: the first run divided capital by symbols PRESENT rather than symbols HELD, contradicting this hypothesis's own specification and deploying only 5/34 of the book, which produced a spurious Gate A failure (CAGR +1.29%). Fixed via an explicit allocate_over setting defaulting to the harvest behaviour; h62/h63/h65 goldens verified byte-identical. Not deployed; does NOT count toward the eight-edge target. Recent window is worse than any prior carry hypothesis: last 365 days -2.04%/yr. Pre-registered and committed (cce944d) before any code existed."

[[entries]]
hypothesis = "H67"
family = "strategy.options.variance_risk_premium"
trial_count = 5
grade = "strategy"
protocol = "confirmatory"
verdict = "killed"
maturity = "L3"
dsr = 0.4078
dsr_n_trials = 152
source = "docs/hypotheses/67-variance-risk-premium.md"
evidence = "Ledger: +5 -> 152 (declared 5-cell design, ALL cells reported). First hypothesis of family F3 (options/VRP) and a KILL TEST, not a strategy build. Gate A fails all four bars at the primary cell (combined 50/50 BTC+ETH, 30d short-variance ladder, 3.0 vol-point haircut): mean +0.455bp/day CI [-2.141,+3.930], CAGR +1.09%, Sharpe 0.16, DSR 0.4078 @152. Gate B fails both: 2x-cost cell -1.833bp/day (CAGR -7.01%), non-overlapping cell Sharpe 0.43 < 1.0. Gate C passes at +0.0237. Cells: BTC-only Sharpe 0.95 / CAGR +8.05%; ETH-only Sharpe -0.37 / CAGR -5.64%; combined 0.16; non-overlapping 0.43; 2x-cost -0.67. Window 2021-04-23..2026-07-09, 1,904 days, Deribit DVOL vs frozen-lake realized vol."
notes = "THE PREMIUM EXISTS AND IS LARGE; THE HARVEST DOES NOT. Gross BTC IV-RV = +8.72 vol points with IV > RV on 72.3% of days over five years, ETH +4.55 on 63.8%. Two things stand between that and a return. (1) THE CONVEXITY TAX, the most transferable finding here: a variance position earns (K^2-RV^2)/(2K), not K-RV, and because realized VARIANCE is right-skewed the harvestable premium is 6.01 vol points on BTC (tax -2.71) and 1.24 on ETH (tax -3.31). An IV-RV screen overstates the harvestable premium by a third on BTC and by 73% on ETH; ETH variance was never sellable at retail in this window against a 3.0-point cost. (2) COST: the derived haircut consumes 50% of BTC's premium and 242% of ETH's. GATE C PASSED THE LETTER AND FAILED THE SPIRIT, and this is the finding worth acting on: full-sample linear correlation with rotation-stop is +0.0237, but conditioned on rotation-stop's worst decile the VRP book returns -0.237%/day, worst 5% -0.417%, worst 1% -1.296% against an unconditional +0.004%. Joint-loss FREQUENCY is 9.8% vs 10.4% under independence -- the dependence is entirely in MAGNITUDE. Pearson correlation cannot see it because the VRP stream is driven by SQUARED returns and is direction-blind, so any short-convexity edge passes the |corr| < 0.30 bar almost automatically while being precisely what blows up when the rest of the book does. PROPOSED AMENDMENT (needs its own decision, not adopted by this verdict): asymmetric or short-convexity hypotheses must also clear a tail-conditional bar on the incumbent's worst-decile days; H67 would have failed Gate C under it. FOURTH CONFIRMATION OF THE REGIME DECAY, on a premium sharing no mechanism with carry: monotone 2021 +15.66%/yr, 2022 +9.30, 2023 +6.79, 2024 -0.53, 2025 -8.60, 2026 -17.59. Funding carry (H62/H63/H65) and the variance risk premium both went to zero over 2024-2026; offered as a market-maturation hypothesis, NOT an established finding, since both are measured on the same calendar window and that is exactly the confound that would produce this spuriously. NOT DONE DELIBERATELY: BTC-only is the best cell (+8.05%/yr, Sharpe 0.95, DSR 0.9205) and was not promoted, because the 50/50 primary was declared before anyone knew ETH would be the weak leg; selecting the better of two after seeing both is the failure pre-registration exists to prevent. The -40% tail condition was not breached (MDD -24.31%, skew -6.69, excess kurtosis +68.4) and that is the LEAST trustworthy number in the study: March 2020, the worst short-vol event in crypto history, is outside the DVOL window and cannot be added. No F3 build is authorized; the Deribit option-chain collector and Greeks layer are not built. Pre-registered and committed (afa6c3e) before any study code existed."

[[entries]]
hypothesis = "H68"
family = "info.crossvenue.dislocation"
trial_count = 12
grade = "info"
protocol = "confirmatory"
verdict = "signal"
maturity = "L3"
source = "docs/hypotheses/68-cross-venue-dislocation.md"
evidence = "Ledger: +12 -> 164 (declared 4 signals x 3 horizons, ALL cells reported). First hypothesis of family F2 (cross-exchange), the family the expansion program ranked highest for structural independence. Panel 20 symbols, 31,752 symbol-days, 2019-01-01..2026-08-27, Binance+OKX (USDT) vs Coinbase Exchange (USD) with a Bitfinex USDT/USD peg. FOUR CELLS SIGNAL, all in the pre-registered direction: S1 raw premium h=1 +0.81% CI [+0.35,+1.18] breadth 19/20; S1 h=7 +3.25% CI [+0.69,+5.73] breadth 19/20; S2 peg-adjusted h=7 +3.17% CI [+0.51,+6.08] breadth 17/20; S2 h=30 +13.36% CI [+2.53,+26.17] breadth 18/20. S3 dispersion and S4 peg deviation are NOISE in all six of their cells. Decomposition identity max|S1-S2-S4| = 8.9e-16."
notes = "THE COINBASE PREMIUM IS NOT THE TETHER PEG. Section 3 named peg contamination as the most likely way this dies and Section 6 pre-declared the branch 'S1 signals and S2 does not -> the folk signal is tether'; the data says the reverse. S2 (peg removed) signals at 7d and 30d while S4 (the peg alone) is noise at every horizon. The information is in the asset dislocation. SIXTH CONFIRMATION OF META-FINDING 1 (crypto is a continuation market), and the first from a data source outside the Binance price/derivative complex: every signalling cell is POSITIVE, exactly as Section 5.2 predicted -- a high US-fiat-venue premium is followed by HIGHER returns. NOT MOMENTUM: signal-to-trailing-return correlations run 0.02-0.09, and with the top/bottom trailing-7d deciles removed S2 holds at +2.47% CI [+0.13,+4.74] while S1 loses significance (+2.16% CI [-0.48,+4.46]) -- so S2, not the larger-headline S1, is the cell to carry forward. NOT CONCENTRATION: dropping each signal's two largest contributors moves S1 3.25->2.95% and S2 3.17->2.85%, both CIs still excluding zero. IT IS AN INDICATOR, NOT AN ARBITRAGE: the p90 premium is 11.42bp while the 7d forward spread is 3.25%, so the information content is ~30x the dislocation's own width and none of it is harvestable by closing the gap; this study says NOTHING about cross-venue arbitrage, which stays untested and out of reach. HONEST WEAK POINT: by year, S2 is positive 8/8 and S1 7/8, but only 4 of 16 year-cells have a CI excluding zero and 2025 is the weakest year (S1 -1.32%). No monotone decay like carry or VRP -- 2024 is the strongest year and 2026 positive -- but a strategy follow-up must confront 2025 rather than average it away. Three venues were collected and deliberately unused with stated reasons (Bitstamp alt volume $2k-$600k/day makes its close a stale trade; Bybit starts 2021-07; Kraken caps at ~720 candles). Two collector bugs found and fixed BEFORE any study ran: an empty batch on a pre-listing `since` was taken as end-of-history (dropped 18 of 24 Coinbase series), and a small-limit year probe pushed mid-year listings to the next January (cost Coinbase SOL seven months, ADA two years); a third truncated Coinbase XRP at its 2021 SEC delisting. XRP's real 904-day halt is handled by segmenting each symbol at breaks in consecutive daily bars, so no forward return spans the hole. INFO GRADE, NOT STRATEGY GRADE: nothing here is deflated, nothing is deployed, nothing is paper-eligible. A strategy hypothesis is owed and faces the INCREMENTAL bar against the deployed book. S3 and S4 are closed. Pre-registered and committed (3eb0fbc) before any study code existed."

[[entries]]
hypothesis = "H69"
family = "strategy.crossvenue.premium"
trial_count = 3
grade = "strategy"
protocol = "confirmatory"
verdict = "killed"
maturity = "L3"
dsr = 0.3598
dsr_n_trials = 167
source = "docs/hypotheses/69-cross-venue-premium-strategy.md"
evidence = "Ledger: +3 -> 167 (declared 3 holding periods, ALL cells reported). Strategy-grade follow-up to H68, engine-graded via run_multi_backtest with next-open fills and 10bp fee + 1bp half-spread + 25bp participation impact per side, window 2019-01-01..2026-07-10, 20 symbols. ALL THREE GATES FAIL. Primary (hold=7d): CAGR +30.30%, Sharpe 0.89, MDD -50.01%, mean +9.176bp/day CI [+1.683,+17.588], DSR 0.3598 @167, time in market 69.3%. A1 and A2 PASS; A3 (Sharpe >= 1.0) and A4 (DSR >= 0.95) FAIL. Gate B FAILS: equal-weight buy-and-hold on the same symbols in the same run over the identical window earns Sharpe 0.94 vs 0.89. Gate C FAILS: correlation with rotation-stop +0.3929 (n=2,652). Cells: hold=1d CAGR +39.06%/Sharpe 0.90/33.0% in market; hold=7d +30.30%/0.89/69.3%; hold=30d +25.23%/0.85/91.7%."
notes = "A SIGNIFICANT SPREAD IS NOT A SHARPE, and that is the transferable finding. H68 measured the S2 spread at +3.17% per 7 days with a CI excluding zero and breadth 17/20 on 31,752 symbol-days; the book built from it with ZERO new parameter search earns Sharpe 0.89 and loses to owning the basket. The info-grade bar has no variance term: E[fwd|HIGH]-E[fwd|LOW] with a CI excluding zero says the conditional means differ and says nothing about the volatility required to collect the difference. The qualifying set averages ~1.4 names, so a panel-wide mean must be harvested through a concentrated book. PROPOSED (not adopted): report an info SIGNAL alongside the VOLATILITY of its bucket, since two identical spreads are not equally valuable if one is carried by 15 names and the other by 1.4. GATE B EARNED ITS PLACE. Section 2 recorded BEFORE the run that the unconditional forward 7d return over this window is +0.92% (~60%/yr) so a long-only crypto book would clear a profitability bar regardless, and that Gate B existed entirely for that reason. A1 and A2 duly passed (+9.176bp/day, CAGR +30.30%) and on those alone this reads as a +30%/yr success; the buy-and-hold comparison is the only thing separating that reading from the truth. THE CORRELATION PREDICTION WAS RIGHT: Section 5.2 predicted 0.3-0.7 before the run and measured +0.3929, so meta-finding 5 holds and this is not an independent edge and does not count toward the eight-edge target. TAIL-CHECK SCOPE: H67's proposed tail-conditional bar was reported (worst decile -1.575%, worst 1% -2.648% vs +0.092% unconditional) and adds NOTHING here because the linear bar already failed at +0.39 -- H67's blindness was specific to short-convexity payoffs driven by squared returns, so that proposed amendment should be scoped to asymmetric payoffs rather than applied universally. RECORDED WITHOUT BEING ACTED ON: at hold=1 the book earns +39.06%/yr while deployed only 33.0% of the time, roughly 118%/yr per unit of time in market against buy-and-hold's 53%; the signal concentrates return but not risk-adjusted return, and an overlay/filter shape would be a NEW pre-registration, not a rescue. 2023 (+91.48%, Sharpe 2.46) and 2024 (+94.14%, Sharpe 2.60) are excellent and must NOT be sliced out post hoc; H68 section 8.6 pre-flagged 2025 as its weak year before this study existed and 2025 (-19.53%) and 2026 (-47.79%) confirm it. IMPLEMENTATION DEVIATION found and corrected before the verdict was written: the first run fed the engine the lake's full extent from 2017-08-17 rather than the declared 2019-01-01 start, letting the benchmark trade the 2017 bubble and 2018 crash while the strategy sat in signal-less cash; correcting it moved the benchmark 0.86 -> 0.94 and the strategy 0.82 -> 0.89, WIDENING the Gate B gap rather than narrowing it. Signal construction was extracted to features/crossvenue.py so H69 consumes the same rows H68 measured; H68's golden verified byte-identical after the refactor. H68's SIGNAL verdict is untouched -- 'the effect is real' and 'the effect is tradable in this shape' are different claims and the ledger holds both. Pre-registered and committed (34b11e5) before any strategy code existed."

[[entries]]
hypothesis = "H70"
family = "strategy.momentum.concentration"
trial_count = 3
grade = "strategy"
protocol = "confirmatory"
verdict = "killed"
maturity = "L4"
dsr = 0.9979
dsr_n_trials = 170
source = "docs/hypotheses/70-rotation-concentration.md"
evidence = "Ledger: +3 -> 170 (declared K in {3,5,8}, ALL cells reported; K=2 is the deployed incumbent, recomputed in the same run). Aimed at the DEPLOYED spec, not a new family. Common window 2,880 days 2018-08-17..2026-07-05, frozen lake, champion walk-forward, StopVolTargetRotation with K the ONLY thing varied. REPRODUCTION: the K=2 recomputation lands on CAGR +42.91% / Sharpe 1.47 / MDD -29.01% against published +42.9% / 1.47 / -29.0%, so every comparison is against the real incumbent. Grid: K=2 Sharpe 1.47 CAGR 42.91% MDD -29.01%; K=3 1.61 / 46.23% / -32.40%; K=5 (primary) 1.40 / 34.53% / -31.46%; K=8 1.27 / 27.13% / -31.82%. Gate A FAILS on the primary (A1 Sharpe 1.40 < 1.47, A2 MDD -31.46% worse than -29.01%) and A2 fails for EVERY cell, so the verdict does not depend on which cell was primary. Gate B passes (DSR 0.9979 @170), Gate C passes (CAGR +34.53% vs +32.18% needed)."
notes = "K=2 VINDICATED, and for the first time on evidence rather than inheritance -- hypothesis 11 line 60 fixed it by fiat ('Long-only. K=2 FIXED') and every descendant including the deployed H42b spec inherited it untested. ALL THREE PRE-REGISTERED PREDICTIONS WERE WRONG: Sharpe and CAGR both PEAK at K=3 and fall away, and MDD is worse than K=2 at every higher K. H66'S CARRY FINDING DOES NOT TRANSFER, and the mechanism is mechanical: carry HARVESTS a premium paid by ~20 near-independent funding streams so averaging more cuts variance without cutting the mean, while rotation SELECTS and the 4th-8th ranked coins are worse assets rather than additional independent draws of the same edge. This is the first evidence that H65's proposed select-vs-harvest distinction is real, arriving from the opposite direction after H66 withdrew it -- recorded as a HYPOTHESIS, not a rule, because one measurement in each of two families is exactly the evidential state that produced the withdrawn refinement. K=3 BEATS THE INCUMBENT ON RETURN (Sharpe 1.61 vs 1.47, CAGR +46.23% vs +42.91%) and loses only on drawdown; it is NOT adopted, for three stated reasons -- it was not the declared primary, it fails the registered MDD bar which is the bar meta-finding 8 says decides prop-firm outcomes, and 0.14 of Sharpe across adjacent K on one path is not a measurement of the K surface. Its numbers go to the owner per the charter rather than being suppressed or acted on. THE LIVE WINDOW SAYS THE OPPOSITE: replaying every cell over the live paper window 2026-07-10..2026-08-26 on data/lake-current at L=90 (what the paper account actually runs) gives K=2 -6.06%, K=3 -7.54%, K=5 -3.85%, K=8 -0.85%, with MDD improving monotonically -15.48% -> -7.09%. So concentration accounts for roughly five of the six points rotation-stop gave up live, which is a real partial answer to the H59 divergence question AND is not a licence to change K: 48 days is 1.7% of the evidence behind the 2,880-day backtest, and switching because the last seven weeks favoured another setting is textbook recency-chasing. SECTION 6'S PRE-DECLARED INFERENCE WAS TOO STRONG AND IS WITHDRAWN: it said a Gate A failure would mean concentration does not explain the live drawdown, but the bars are computed on the frozen backtest and cannot answer a question about the live window. The verdict stands on the bars; the further claim does not. Run alongside the standing re-validation owed by family-expansion-program.md section 5: rotation-stop reproduces 0.9921 @104 vs published 0.992 then scores 0.9889 @167, rotation reproduces 0.9905 @65 vs 0.990 then 0.9870 -- both CLEAR the 0.95 bar, and 42 more trials cost 0.003 each. Nothing is deployed, changed or made paper-eligible; the paper records continue unchanged, which is the correct outcome of a vindication. Pre-registered and committed (05d9b1f) before any study code existed."

[[entries]]
hypothesis = "H71"
family = "method.universe.point_in_time"
trial_count = 2
grade = "strategy"
protocol = "confirmatory"
verdict = "confirmed"
maturity = "L4"
dsr = 0.2759
dsr_n_trials = 172
source = "docs/hypotheses/71-point-in-time-universe.md"
evidence = "Ledger: +2 -> 172 (declared reselection cadences 90d and 365d, BOTH reported). Aimed at the MEASURING INSTRUMENT, not at an edge. config/universe.json fixes its 40 symbols by 'top40 by 24h quote volume, 2026-07-12' -- the END of the sample -- and only 8 of the 40 existed for the whole 2018-2026 backtest. H71 re-ran the deployed spec unchanged over a point-in-time universe selected from 469 active Binance USDT pairs (393 usable in-window) by trailing 30d quote volume, top 40, reselected periodically. Common window 2,880 days 2018-08-17..2026-07-05. INCUMBENT ARM IS FAITHFUL: it returns CAGR +42.91% / Sharpe 1.47 / MDD -29.01%, the published deployed figures and identical to H70's independent recomputation. POINT-IN-TIME 90d (primary): CAGR +21.06%, Sharpe 0.86, MDD -33.23%, mean +6.165bp/day CI [+0.765,+12.243], DSR 0.2759 @172. POINT-IN-TIME 365d: CAGR +17.15%, Sharpe 0.73, MDD -35.85%. A1 FAILS (Sharpe 0.86 < 1.0), A2 PASSES (CI excludes zero), A3 FAILS (DSR 0.2759 < 0.95), B4 FAILS (0.86 vs 1.03 needed). SHARPE RETAINED 58%, CAGR RETAINED 49%, drawdown worse by 4.2pp."
notes = "THE HINDSIGHT UNIVERSE WAS DOING ROUGHLY 40% OF THE WORK. Same strategy, same engine, same costs, same window, ZERO parameters changed -- the only difference is which symbols may be ranked. ALL THREE PRE-REGISTERED PREDICTIONS WERE RIGHT: 2019-2020 overlap with the hindsight 40 predicted under 40% and measured 26%; Sharpe predicted to fall to 0.7-1.2 and measured 0.86; degradation predicted to concentrate in 2021 and 2026 and measured -65pp and -111pp. NOT CHURN: the 365d low-churn cell is WORSE (0.73), so slowing reselection does not recover the gap and the degradation is not a turnover artifact; turnover averaged 9.3 new names per 90d reselection, already inside the numbers. THE OVERLAP TABLE IS THE MECHANISM: in 2021, the year the incumbent posts +98.09%, only 13 of the 40 rankable coins were actually top-40 by volume then; overlap rises monotonically 20% -> 55% toward the snapshot date, which is the shape hindsight selection produces. PER-YEAR SIGNATURE: the point-in-time book BEATS the incumbent in four of nine years and loses catastrophically only in the three biggest incumbent years; 2026 flips +92.80% -> -18.61%. A uniformly weaker strategy would lose everywhere. STILL AN UPPER BOUND, and this is the most important caveat: Binance lists only pairs active TODAY, so a coin genuinely top-40 in 2019 and since delisted cannot enter the point-in-time universe either. Four universe symbols (GRAM, PYR, SPCXB, VANRY) were delisted within six weeks of the snapshot and PYR and VANRY are two of H59b's five worst live performers -- the survivorship mechanism operating in real time. The honest Sharpe is AT MOST 0.86. CONSEQUENCES, pre-registered and therefore not softenable: rotation-stop comes OFF THE EVALUATION PATH; the paper records continue as measurement rather than candidacy; the published rotation-family figures are re-stated in PROJECT_MEMORY and PROJECT_STATE while historical verdicts are ANNOTATED IN PLACE, never rewritten (the H65/H66 precedent). Affected: H11, H41, H42a/b, H43a, H70. WHAT DOES NOT FOLLOW: this is not 'momentum is worthless' -- A2 passed, mean +6.165bp/day with a CI excluding zero, so a real but weak edge remains and what died is its claimed SIZE; and it does NOT automatically transfer to carry, which ranks in the same universe but HARVESTS rather than SELECTS (H70) and has not been re-run point-in-time, which is the obvious next registration. The DSR column in this study deflates against the variance of its own three books, a narrower benchmark than the deployed spec's published estimator, so the incumbent's 0.8844 here is NOT a revision of the published 0.9909 and must not be quoted as one. Pre-registered and committed (db3e27a) before any study code existed."

[[entries]]
hypothesis = "H72"
family = "method.universe.point_in_time"
trial_count = 2
grade = "strategy"
protocol = "confirmatory"
verdict = "confirmed"
maturity = "L4"
dsr = 1.0
dsr_n_trials = 174
source = "docs/hypotheses/72-point-in-time-carry.md"
evidence = "Ledger: +2 -> 174 (declared reselection cadences 90d and 365d, BOTH reported). The H71 correction applied to the project's only other validated edge. Pool: 698 active USDT-margined Binance perps collected, 342 eligible with spot + perp + funding. Common window 2,494 days 2019-09-11..2026-07-09. REPRODUCE-FIRST GUARD PASSED BEFORE ANY POOL RESULT EXISTED: the trailing-funding filter run against H63's own caches returned Sharpe 6.00 / CAGR +4.51% / MDD -0.51%, H63's published figures to the digit. Both incumbents also reproduce in-run on pool data: hindsight wide 5.61/+4.36% vs published 5.60/+4.36%, 8 majors 5.91/+4.64% vs published 5.91/+4.64%. POINT-IN-TIME 90d (primary): CAGR +2.35%, Sharpe 4.83, MDD -0.35%, mean +0.637bp/day CI [+0.309,+1.048], DSR 1.0000 @174. POINT-IN-TIME 365d: CAGR +1.82%, Sharpe 4.02, MDD -0.33%. ALL FOUR BARS PASS: A1 4.83 >= 1.0, A2 CI excludes zero, A3 DSR 1.0000, B4 4.83 >= 3.93 needed. SHARPE RETAINED 86% against momentum's 58% (H71)."
notes = "CARRY SURVIVES THE CORRECTION THAT KILLED MOMENTUM, and the prediction was committed before the run. Section 5.1 stated carry would pass where momentum failed, with retention materially above 58%; measured 86%. THE BIAS IN THE LIST IS JUST AS LARGE -- overlap between the point-in-time top-40 and the hindsight universe runs 28% in 2020, 32% in 2021, rising monotonically to 52% in 2025, the SAME numbers H71 found for momentum. The universes are equally contaminated; the edges are not equally damaged. This is the STRONGEST EVIDENCE YET for the select/harvest distinction (meta-finding 14), arriving as a confirmed prediction rather than a pattern noticed afterwards: rotation RANKS and takes the top 2, so a pool stuffed with later-famous names hands it winners it could not have picked (42% of its Sharpe); carry HOLDS EVERYTHING PAYING, so a biased list changes which ~40 streams get averaged and little else (14% of its Sharpe). The distinction was proposed by H65, refuted by H66, rebuilt from the opposite direction by H70, and has now made a correct prediction -- it is no longer speculation. WHAT THE PASS COSTS: retention is NOT uniform. Sharpe retains 86% but CAGR retains only 54% (+4.36% -> +2.35%), and CAGR is what an income project actually spends; any future sizing arithmetic must use +2.35%. MDD IMPROVES (-0.78% -> -0.35%), consistent with H66's finding that carry's Sharpe is a diversification property -- the same mechanism that makes it robust also makes it shallower. THE LOAD-BEARING CAVEAT, written into Section 7 before the run precisely so a pass could not obscure it: 2025 and 2026 are approximately zero in EVERY arm (-0.05% and -0.07% point-in-time), the fourth and fifth independent confirmation after H62, H63 and H65 that carry earns nothing in the current regime. This hypothesis establishes that carry's HISTORICAL edge is real and survives an honest universe; it establishes nothing about whether that edge is paid TODAY, and the evidence there remains uniformly negative. STILL AN UPPER BOUND AND HERE THE SIGN IS UNKNOWN: delisted perps are absent, and unlike momentum -- where the missing streams were probably unfavourable, making the correction conservative -- a delta-neutral book is SHORT the perp, gaining through a collapse and losing violently through the squeeze that often precedes delisting. Whether the missing contracts would raise or lower 4.83 cannot be determined. WHERE THIS LEAVES THE PROJECT: exactly ONE validated edge survives an honest universe, against the eight the family-expansion program's arithmetic requires. It is real, robust, currently unpaid, and not deployed. Pre-registered and committed (18ed853) before any study code existed."

