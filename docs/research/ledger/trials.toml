# Historical trial ledger — migrated by LABELLING, never recomputed.
#
# SOURCE OF TRUTH. The SQLite index is derived from this file and is
# disposable; this file is not. TOML because it is stdlib-readable
# (tomllib) and keeps comments — the project is stdlib-first.
#
# Every entry cites the committed document its count was read from. Nothing
# here recomputes a DSR, Sharpe, CI or verdict: `dsr` and `dsr_n_trials`
# record what was PUBLISHED and the count it was actually deflated against
# (65 for rotation, 104 for H42b, 107 for H43a). See correction candidates
# 6-8 in docs/research/mi-layer2-design.md.
#
# RECONCILIATION CAVEAT — a finding, not a defect to fix:
# The ledger's headline total of 120 is NOT reconstructible at per-hypothesis
# granularity from the committed documents. Sixteen batches declare an
# explicit "+N"; the Phase 3 era declares only a program total; several rows
# declare none. Documented deltas are recorded exactly as written and the
# unexplained remainder is carried in `[unallocated]` rather than being
# distributed by guess.

