[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "martex-quant"
version = "1.0.1"
description = "Quantitative trading research platform: data pipeline, event-driven backtesting, statistical validation, Monte Carlo, paper trading."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mvnikolov" }]
keywords = [
    "trading",
    "quantitative-finance",
    "backtesting",
    "algorithmic-trading",
    "research",
    "crypto",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "ccxt>=4.3",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "tzdata>=2024.1",  # IANA timezone db; required on Windows for zoneinfo
]

[project.optional-dependencies]
mt5 = [
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",  # official MT5 Python API
]
research = [
    # TSLA CNN study only (src/martex_quant/research/tesla). Not needed by the
    # data pipeline, backtester, or any live/paper path — keep it out of the
    # runtime install.
    "tensorflow-cpu>=2.16",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/MartexHACK/martex-quant"
Repository = "https://github.com/MartexHACK/martex-quant"
Issues = "https://github.com/MartexHACK/martex-quant/issues"
Changelog = "https://github.com/MartexHACK/martex-quant/blob/main/CHANGELOG.md"

[project.scripts]
martex-quant = "martex_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The research corpus (hypotheses, trial ledger, universe config) is vendored
# into martex_quant/_bundle/ at build time by setup.py, so an installed wheel
# can scaffold a complete workspace. See martex_quant/bundle.py.
martex_quant = ["_bundle/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # modernize syntax
    "B",   # common bug patterns (flake8-bugbear)
    "SIM", # simplifications
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["martex_quant"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "ccxt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "MetaTrader5.*"
ignore_missing_imports = true

# Research-only deps (TSLA CNN study). Neither ships type stubs.
[[tool.mypy.overrides]]
module = ["keras.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    # Golden regression over the research scripts (MI Lab Layer 1). Needs the
    # local data lake, which is gitignored — skips in CI, gates locally.
    "slow: re-runs the research scripts end to end (~40s total)",
]
